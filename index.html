<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>Английские слова</title>

<style>
:root{--bg:#f3f4fb;--text:#1b1f2e;--hint:#6b7189;--card:#fff;--grad:linear-gradient(135deg,#6366f1,#8b5cf6 50%,#ec4899);--ok:#16a34a;--bad:#dc2626;--shadow:0 6px 24px rgba(79,70,229,.12);--r:22px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--text:#eef0f8;--hint:#9aa0b8;--card:#1a1f33}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));min-height:100vh}
main{max-width:600px;margin:0 auto;padding:18px 16px}
h1{font-size:25px;margin:6px 0 6px}h2{font-size:18px;margin:16px 0 10px}
.sub{color:var(--hint);font-size:15px;margin:0 0 14px;line-height:1.45}
.hero{background:var(--grad);color:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.hero .big{font-size:34px;font-weight:800}.hero .label{opacity:.9;font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 16px;font:inherit;font-size:17px;font-weight:600;background:var(--grad);color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(99,102,241,.3);text-align:center;text-decoration:none;margin:9px 0}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:none;border:1px solid rgba(127,127,127,.3)}
.btn.danger{background:linear-gradient(135deg,#ef4444,#f97316);box-shadow:none}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:15px;margin:0}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn:active{transform:scale(.98)}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(127,127,127,.3);background:var(--bg);color:var(--text);margin:6px 0;outline:none}
input:focus,select:focus,textarea:focus{border-color:#6366f1}
textarea{min-height:110px}
label.check{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:16px}
label.check input{width:22px;height:22px;margin:0}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row>.auto{flex:0 0 auto}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(127,127,127,.15)}
.li:last-child{border-bottom:0}.li small{color:var(--hint);display:block;font-size:13px}
.stat{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(127,127,127,.14)}
.stat:last-child{border-bottom:0}
.pill{display:inline-block;padding:4px 11px;border-radius:12px;background:rgba(99,102,241,.16);color:#6366f1;font-size:14px;font-weight:600}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.empty{text-align:center;padding:28px 12px;color:var(--hint)}.empty .ico{font-size:44px;display:block;margin-bottom:8px}
.bar{height:10px;border-radius:6px;background:rgba(127,127,127,.2);overflow:hidden;margin:10px 0}
.bar>div{height:100%;background:var(--grad);transition:width .4s}
/* тренировка */
.ring{display:block;margin:4px auto 6px}
.ring-bg{stroke:rgba(127,127,127,.2)}
.stage{text-align:center;padding:16px 12px 18px}
.steps{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 4px;font-size:13px}
.steps span{padding:5px 10px;border-radius:12px;background:rgba(127,127,127,.12);color:var(--hint)}
.steps span.on{background:var(--grad);color:#fff;font-weight:600}
.status{font-size:16px;color:var(--text);min-height:24px;margin:12px 0 4px;font-weight:500}
.mic-wrap{position:relative;width:132px;height:132px;margin:10px auto}
.mic{position:relative;width:132px;height:132px;border-radius:50%;border:0;background:var(--grad);color:#fff;font-size:46px;cursor:pointer;box-shadow:0 10px 30px rgba(99,102,241,.35);z-index:1}
.mic:disabled{opacity:.45}
.mic.listening{animation:breathe 1.1s ease-in-out infinite}
.pulse{position:absolute;inset:0;border-radius:50%;border:3px solid #6366f1;opacity:0}
.mic.listening~.pulse{animation:pulse 1.6s ease-out infinite}.mic.listening~.pulse.p2{animation-delay:.8s}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pulse{from{transform:scale(1);opacity:.6}to{transform:scale(1.5);opacity:0}}
.heard{margin:12px 0 4px;padding:14px;border-radius:16px;background:rgba(99,102,241,.1);min-height:58px;font-size:18px;font-weight:600;text-align:left}
.heard .lbl{display:block;font-size:13px;color:var(--hint);font-weight:500;margin-bottom:4px}
.hintbox{margin:8px 0;padding:12px;border-radius:14px;background:rgba(245,158,11,.14);font-size:16px;text-align:left}
.verdict{border-radius:var(--r);padding:18px;margin-top:12px;color:#fff;text-align:center}
.verdict.ok{background:linear-gradient(135deg,#16a34a,#22c55e)}.verdict.bad{background:linear-gradient(135deg,#dc2626,#f97316)}
.verdict .head{font-size:22px;font-weight:800}.verdict .tr{font-size:19px;margin-top:8px;font-weight:600}.verdict .en{opacity:.92;font-size:15px;margin-top:4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.speed{display:flex;align-items:center;gap:10px;margin:10px 0 2px;font-size:14px;color:var(--hint)}
.speed input{margin:0;padding:0;width:100%}
.speed b{min-width:44px;text-align:right;color:var(--text)}
/* слова */
.ugroup{margin-bottom:20px}
.uhead{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;padding:6px 2px 6px;border-bottom:2px solid rgba(99,102,241,.35);margin-bottom:4px}
.wrow{padding:11px 2px;border-bottom:1px solid rgba(127,127,127,.12)}
.wrow:last-child{border-bottom:0}
.wrow small{color:var(--hint);font-size:13px}
/* обучение */
.dots{display:flex;justify-content:center;gap:8px;margin:6px 0 14px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(127,127,127,.3)}
.dots i.on{background:#6366f1;width:24px;border-radius:6px}
.howto{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(127,127,127,.12)}
.howto:last-child{border-bottom:0}
.howto .ic{font-size:30px;width:44px;text-align:center}
.howto b{display:block;font-size:16px}.howto span{color:var(--hint);font-size:14px}
/* нижнее меню */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,.08);z-index:10}
.tabbar a{flex:1;text-align:center;font-size:12px;color:var(--hint);text-decoration:none;padding:4px 0;border-radius:12px}
.tabbar a span{display:block;font-size:21px;margin-bottom:2px}
.tabbar a.active{color:#6366f1;font-weight:700}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;z-index:20;max-width:90%;text-align:center}
</style>
</head>

  } else if (st === 3){
    body = '<h1>Шаг 3. Как отвечать</h1><p class="sub">Каждое слово проходит в три шага. Пошаговая подсказка видна на экране.</p>' +
      '<div class="card">' +
      '<div class="howto"><div class="ic">🔊</div><div><b>Слушайте</b><span>Слово произносится само. Нажмите «Слушать слово», чтобы повторить.</span></div></div>' +
      '<div class="howto"><div class="ic">🎤</div><div><b>Говорите</b><span>Нажмите микрофон и скажите перевод по-русски. Можно писать текстом в поле ниже.</span></div></div>' +
      '<div class="howto"><div class="ic">✅</div><div><b>Проверьте</b><span>Нажмите «Проверить». Не поняли слово? Нажмите «👁 Показать слово» — появится английское написание. Или «Пропустить».</span></div></div>' +
      '</div>';
    nav = '<button class="btn ghost" onclick="learnTo(2)">← Назад</button><button class="btn" onclick="learnTo(4)">Далее →</button>';

window.learnTo = function(n){ S.learnStep = n; save(); viewLearn(); };
window.learnLoad = function(){ loadBundled(true); S.learnStep = 2; save(); viewLearn(); };
window.learnFinish = function(){ S.settings.onboarded = true; S.learnStep = 1; save(); go("train"); };

// ===== Экран: главная тренировка =====
function viewTrain(){
  markTab("train");

    var parts = partsList(u);
    html += '<div class="card"><div class="row" style="margin-bottom:4px"><b style="font-size:18px">Unit ' + esc(u) + '</b><span class="pill">' + wordsOf(u,"*").length + ' слов</span></div>' +
      '<button class="btn" onclick="goStart(\'' + esc(u) + '\',\'*\')">▶︎ Все Part</button>' +

window.goStart = function(unit, part){ try { showQuestion(startSession(unit, part, "train")); } catch (e) { toast(e.message); } };
window.retryFrom = function(sid){
  var src = S.sessions.filter(function(s){ return s.id === sid; })[0]; if (!src) return;
  var wrong = sessionStats(src).wrongIds.filter(function(id){ return S.words.some(function(w){ return w.id === id; }); });
  if (!wrong.length) return toast("Ошибок нет");
  showQuestion(startSession(src.unit, src.part, "retry", wrong));
};
window.againTrain = function(){
  var fin = S.sessions.filter(function(s){ return s.finished && s.mode === "train"; });
  if (!fin.length) return go("train");
  goStart(fin[fin.length-1].unit, fin[fin.length-1].part);
};

var cur = null;
function ring(done, total){
  var r=62, c=2*Math.PI*r, pct = total ? done/total : 0;
  return '<svg class="ring" viewBox="0 0 150 150" width="150" height="150">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>' +
    '<circle class="ring-bg" cx="75" cy="75" r="' + r + '" stroke-width="12" fill="none"/>' +
    '<circle cx="75" cy="75" r="' + r + '" stroke="url(#g)" stroke-width="12" fill="none" stroke-linecap="round" transform="rotate(-90 75 75)" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c*(1-pct)) + '"/>' +
    '<text x="75" y="72" text-anchor="middle" font-size="26" font-weight="800" fill="currentColor">' + done + '/' + total + '</text>' +
    '<text x="75" y="92" text-anchor="middle" font-size="11" fill="#6b7189">слов</text></svg>';
}
function speedBar(){
  var r = S.settings.rate;
  return '<div class="speed">🐢<input type="range" min="0.2" max="2" step="0.1" value="' + r + '" oninput="setRate(this.value)">🐇<b id="rateLbl">' + r.toFixed(1) + 'x</b></div>';
}
window.setRate = function(v){ S.settings.rate = clampRate(v); save(); var l=$("#rateLbl"); if (l) l.textContent = S.settings.rate.toFixed(1) + "x"; };

function showQuestion(s){
  cur = { s: s, heard: null, verdict: false };
  var w = currentWord(s);
  if (!w) return viewFinish(s);
  var st = sessionStats(s);
  var title = s.mode === "retry" ? "🔁 Повтор ошибок" : "Unit " + esc(s.unit) + (s.part === "*" ? "" : " · Part " + esc(s.part));
  view('<h1>' + title + '</h1>' +
    '<div class="card stage">' + ring(s.index, s.wordIds.length) +
    '<div class="sub" style="margin:0">Слово ' + (s.index+1) + ' из ' + s.wordIds.length + ' · ошибок: ' + st.errors + '</div>' +
    '<div class="steps"><span id="s1" class="on">1 Слушайте</span><span id="s2">2 Говорите</span><span id="s3">3 Проверьте</span></div>' +
    '<button class="btn ghost small" onclick="replayWord()">🔊 Слушать слово</button>' +
    '<div id="status" class="status">Слушайте слово…</div>' +
    '<div class="mic-wrap"><button id="mic" class="mic" onclick="toggleMic()">🎤</button><span class="pulse"></span><span class="pulse p2"></span></div>' +
    '<div class="heard"><span class="lbl">Вы сказали</span><span id="heardText" style="color:var(--hint)">—</span></div>' +
    '<input id="txt" placeholder="Или напишите перевод здесь" autocomplete="off">' +
    '<div id="hintBox"></div><div id="verdictBox"></div>' +
    '<div class="actions" id="actions">' +
      '<button class="btn" id="checkBtn" onclick="checkAnswer()">✅ Проверить</button>' +
      '<button id="showBtn" class="btn ghost" onclick="showHint()">👁 Показать слово</button>' +
      '<button class="btn ghost" style="grid-column:1/-1" onclick="skipWord()">⏭ Пропустить</button>' +
    '</div></div>' +
    speedBar() +
    '<button class="btn ghost" style="color:var(--bad);margin-top:10px" onclick="finishNow()">⏹ Завершить тренировку</button>');
  speakThen(w.en, function(){ startListening(); });
}
function setStep(n){ for (var i=1;i<=3;i++){ var el=$("#s"+i); if (el) el.className = (i===n ? "on" : ""); } }
function setStatus(t){ var el=$("#status"); if (el) el.textContent = t; }
function setListening(on){ var m=$("#mic"); if (m) m.classList.toggle("listening", on); }
function startListening(){
  if (!cur || cur.verdict) return;
  if (!SR){ setStatus("Голос в этом браузере не работает — напишите перевод в поле ниже"); setStep(2); return; }
  stopListen(); setListening(true); setStep(2); setStatus("🎙 Говорите перевод…");
  listen(function(alts){
    setListening(false); cur.heard = alts;
    $("#heardText").textContent = alts[0]; $("#heardText").style.color = "";
    setStep(3); setStatus("Проверьте и нажмите «Проверить»");
  }, function(err){
    setListening(false); setStatus(err.message + ". Нажмите 🎤 ещё раз или напишите перевод.");
  });
}
window.toggleMic = function(){
  if (!cur || cur.verdict) return;
  if ($("#mic").classList.contains("listening")){ stopListen(); setListening(false); setStatus("Нажмите 🎤, чтобы говорить"); }
  else startListening();
};
window.replayWord = function(){ var w = cur && currentWord(cur.s); if (w) speakThen(w.en, function(){}); };
window.checkAnswer = function(){
  if (!cur || cur.verdict) return;
  var typed = ($("#txt").value || "").trim();
  var alts = typed ? [typed] : (cur.heard || []);
  if (!alts.length) return toast("Сначала скажите перевод или напишите его в поле");
  judge(alts, false, false);
};
window.showHint = function(){
  if (!cur || cur.verdict) return;
  var w = currentWord(cur.s);
  $("#hintBox").innerHTML = '<div class="hintbox">👁 Слово: <b style="font-size:22px">' + esc(w.en) + '</b><br><span style="color:var(--hint);font-size:14px">Теперь скажите или напишите перевод. Показ слова ошибкой не считается.</span></div>';
  var b = $("#showBtn"); if (b) b.disabled = true;
};
window.skipWord = function(){ if (cur && !cur.verdict) judge([], true, false); };
function judge(alts, skipped, hinted){
  var s = cur.s, w = currentWord(s);
  var correct = !skipped && alts.some(function(a){ return isCorrect(a, w.ru); });
  var said = skipped ? "" : (alts.filter(function(a){ return isCorrect(a, w.ru); })[0] || alts[0] || "");
  record(s, w.id, correct, skipped);
  save();
  cur.verdict = true; stopListen(); setListening(false); setStatus(""); setStep(3);
  var done = s.index >= s.wordIds.length;
  var head = correct ? "🎉 Верно!" : hinted ? "💡 Подсказка" : skipped ? "⏭ Пропущено" : "❌ Не совсем";
  $("#verdictBox").innerHTML = '<div class="verdict ' + (correct ? "ok" : "bad") + '">' +
    '<div class="head">' + head + '</div><div class="tr">' + esc(w.ru) + '</div>' +
    '<div class="en">' + esc(w.en) + (!skipped && said ? " · вы сказали: «" + esc(said) + "»" : "") + '</div></div>';
  $("#actions").innerHTML = '<button class="btn" style="grid-column:1/-1" onclick="nextStep()">' + (done ? "🏁 Итоги тренировки" : "Дальше →") + '</button>';
  var t = $("#txt"); if (t) t.disabled = true;
}
window.nextStep = function(){ var s = cur.s; if (s.index >= s.wordIds.length) viewFinish(s); else showQuestion(s); };
window.finishNow = function(){ if (!cur) return; stopListen(); viewFinish(cur.s); };
function viewFinish(s){
  stopListen(); cur = null;
  var pts = finishSession(s), st = sessionStats(s);
  view('<h1>🏁 Готово!</h1>' +
    '<div class="hero" style="text-align:center"><div class="label">Точность</div><div class="big">' + st.percent + '%</div>' +
    '<div class="label" style="margin-top:6px">' + (s.mode === "retry" ? "Повтор без начисления баллов" : "Баллы за тренировку: " + sign(pts)) + '</div></div>' +
    '<div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">' +
      '<div class="card" style="text-align:center"><div class="sub" style="margin:0">Правильно</div><b style="font-size:24px">' + st.correct + '</b></div>' +
      '<div class="card" style="text-align:center"><div class="sub" style="margin:0">Ошибок</div><b style="font-size:24px">' + st.errors + '</b></div>' +
      '<div class="card" style="text-align:center"><div class="sub" style="margin:0">Пропусков</div><b style="font-size:24px">' + st.skipped + '</b></div>' +
      '<div class="card" style="text-align:center"><div class="sub" style="margin:0">Баланс</div><b style="font-size:24px">' + balance() + '</b></div></div>' +
    (st.wrongIds.length ? '<button class="btn" onclick="retryFrom(' + s.id + ')">🔁 Повторить ошибки (' + st.wrongIds.length + ')</button>' : '') +
    '<button class="btn ghost" onclick="againTrain()">🔄 Пройти заново</button>' +
    '<button class="btn ghost" onclick="go(\'train\')">🏠 К выбору урока</button>');
}

// ===== Слова: поиск по Unit и Part, без удаления и изменения =====
var wf = { unit: "*", part: "*", q: "" };
function viewWords(){
  markTab("words");
  var units = unitsList();
  var unitOpts = '<option value="*">Все Unit</option>' + units.map(function(u){ return '<option value="' + esc(u) + '" ' + (wf.unit===u?"selected":"") + '>Unit ' + esc(u) + '</option>'; }).join("");
  var partOpts = '<option value="*">Все Part</option>' + (wf.unit === "*" ? [] : partsList(wf.unit)).map(function(p){ return '<option value="' + esc(p) + '" ' + (wf.part===p?"selected":"") + '>' + (p ? "Part " + esc(p) : "Без Part") + '</option>'; }).join("");
  view('<h1>Мои слова <span class="pill">' + S.words.length + '</span></h1>' +
    '<div class="card"><div class="row"><select id="f-unit" onchange="setUnitFilter(this.value)">' + unitOpts + '</select>' +
    '<select id="f-part" onchange="setPartFilter(this.value)">' + partOpts + '</select></div>' +
    '<input id="f-q" placeholder="🔍 Поиск по слову или переводу" value="' + esc(wf.q) + '" oninput="setQFilter(this.value)"></div>' +
    '<div id="wordList"></div>' +
    '<div class="card"><h2 style="margin-top:0">Добавить слово</h2>' +
    '<input id="w-en" placeholder="English, например: apple"><input id="w-ru" placeholder="Перевод, например: яблоко">' +
    '<button class="btn" onclick="addWord()">➕ Добавить</button>' +

}
window.setUnitFilter = function(v){ wf.unit = v; wf.part = "*"; viewWords(); };
window.setPartFilter = function(v){ wf.part = v; renderWordList(); };
window.setQFilter = function(v){ wf.q = v; renderWordList(); };
function renderWordList(){
  var q = norm(wf.q);
  var list = S.words.filter(function(w){
    if (wf.unit !== "*" && w.unit !== wf.unit) return false;
    if (wf.part !== "*" && w.part !== wf.part) return false;
    if (q && norm(w.en + " " + w.ru).indexOf(q) === -1) return false;
    return true;
  });
  var groups = {};
  list.forEach(function(w){ (groups[w.unit] = groups[w.unit] || []).push(w); });
  var keys = Object.keys(groups).sort(unitSort);
  var html = "";
  keys.forEach(function(u){
    var items = groups[u].slice().sort(function(a,b){ return String(a.part).localeCompare(String(b.part)) || a.en.localeCompare(b.en); });
    html += '<div class="ugroup"><div class="uhead"><span>Unit ' + esc(u) + '</span><span class="pill">' + items.length + '</span></div>' +
      items.slice(0, 300).map(function(w){ return '<div class="wrow"><b>' + esc(w.en) + '</b> — ' + esc(w.ru) + '<br><small>' + (w.part ? "Part " + esc(w.part) : "без Part") + '</small></div>'; }).join("") +
      '</div>';
  });
  var box = $("#wordList");
  if (box) box.innerHTML = html || '<div class="card empty"><span class="ico">🔍</span>Ничего не найдено</div>';
}
window.addWord = function(){
  var en = $("#w-en").value.trim(), ru = $("#w-ru").value.trim();
  if (!en || !ru) return toast("Заполните оба поля");
  S.words.push({ id: nextId(), unit: "Мои", part: "", en: en, ru: ru }); save(); toast("Слово добавлено ✨"); viewWords();
};

// ===== Статистика =====
function viewStats(){
  markTab("stats");
  var fin = S.sessions.filter(function(s){ return s.finished && s.mode === "train"; });
  var rows = {}, total=0, correct=0, errors=0, skipped=0;
  fin.forEach(function(s){
    var st = sessionStats(s), n = Object.keys(s.results).length;
    total += n; correct += st.correct; errors += st.errors; skipped += st.skipped;
    var k = s.unit + "|" + s.part; rows[k] = rows[k] || { t:0, c:0 }; rows[k].t += n; rows[k].c += st.correct;
  });
  var pct = total ? Math.round(100*correct/total) : 0;
  view('<h1>Статистика</h1>' +
    '<div class="hero"><div class="label">Процент правильных</div><div class="big">' + pct + '%</div><div class="label" style="margin-top:6px">Баланс: ' + sign(balance()) + ' ⭐</div></div>' +
    '<div class="card" style="margin-top:14px">' +
      '<div class="stat"><span>Всего слов</span><b>' + total + '</b></div>' +
      '<div class="stat"><span>✅ Правильных</span><b>' + correct + '</b></div>' +
      '<div class="stat"><span>❌ Ошибок</span><b>' + errors + '</b></div>' +
      '<div class="stat"><span>⏭ Пропусков и подсказок</span><b>' + skipped + '</b></div></div>' +
    '<h2>По Unit и Part</h2><div class="card">' +
      (Object.keys(rows).map(function(k){ var p=k.split("|"); var r=rows[k]; return '<div class="stat"><span>Unit ' + esc(p[0]) + ' · Part ' + esc(p[1] || "—") + '</span><b>' + (r.t ? Math.round(100*r.c/r.t) : 0) + '% · ' + r.t + '</b></div>'; }).join("") || '<div class="empty">Данных пока нет</div>') +
    '</div><h2>История</h2><div class="card">' +
      (fin.slice().reverse().slice(0,30).map(function(s){ return '<div class="stat"><span>Unit ' + esc(s.unit) + ' ' + esc(s.part) + (s.mode==="retry"?" · повтор":"") + '</span><b class="' + (s.points>=0?"pos":"neg") + '">' + sign(s.points) + '</b></div>'; }).join("") || '<div class="empty">Тренировок пока нет</div>') +
    '</div>');
}
function viewPoints(){

    '<h2>Последние тренировки</h2><div class="card">' +

      '<button class="btn" onclick="saveSettings()">Сохранить</button></div>' +
    '<div class="card"><h2 style="margin-top:0">📋 Таблица баллов</h2>' +
      S.rules.map(function(r,i){ return '<div class="li"><div>' + ruleLabel(r) + '</div><div class="row auto"><button class="btn ghost small" onclick="editRule(' + i + ')">✏️</button><button class="btn danger small" onclick="delRule(' + i + ')">🗑</button></div></div>'; }).join("") +
      '<h2>Новое правило</h2>' +
      '<div class="row"><input id="r-min" type="number" min="0" placeholder="от ошибок"><input id="r-max" type="number" min="0" placeholder="до (пусто = ∞)"></div>' +
      '<select id="r-pts">' + pointOptions(0) + '</select>' +
      '<button class="btn" onclick="addRule()">➕ Добавить правило</button>' +
      '<button class="btn ghost" onclick="resetRules()">♻️ Стандартная таблица</button></div>' +
    '<div class="card"><h2 style="margin-top:0">🌐 Слова</h2>' +
      '<p class="sub">Словарь Navigate B1+, Unit 1–12, 800 слов с переводами. Повторная загрузка добавит только новые слова.</p>' +
      '<button class="btn" onclick="loadBundled(false)">📘 Загрузить словарь</button>' +
      '<textarea id="src-text" placeholder="apple - яблоко&#10;cat - кот"></textarea>' +
      '<button class="btn ghost" onclick="loadManual()">Добавить свои слова (раздел «Мои»)</button></div>' +
    '<div class="card"><h2 style="margin-top:0">🎓 Обучение</h2>' +
      '<p class="sub">Пошаговая инструкция: как загрузить слова, выбрать урок и отвечать.</p>' +
      '<button class="btn ghost" onclick="openLearn()">Открыть обучение</button></div>');
}
window.openLearn = function(){ S.learnStep = 1; save(); go("learn"); };
window.saveSettings = function(){
  S.settings.perSession = Number($("#s-words").value);
  S.settings.shuffle = $("#s-shuffle").checked;
  save(); toast("Сохранено ✅"); viewSettings();
};
function ruleInput(){ var mx = $("#r-max").value.trim(); return { min: Number($("#r-min").value), max: mx === "" ? null : Number(mx), points: Number($("#r-pts").value) }; }
function validRule(r){
  if (!(r.min >= 0 && Math.floor(r.min) === r.min)) return "Минимум ошибок — целое число от 0";
  if (r.max !== null && (!(r.max >= r.min) || Math.floor(r.max) !== r.max)) return "Максимум должен быть не меньше минимума";
  if (!(r.points >= -5 && r.points <= 5)) return "Баллы от -5 до 5";
  return null;
}
window.addRule = function(){ var r = ruleInput(), e = validRule(r); if (e) return toast(e); S.rules.push(r); save(); viewSettings(); };
window.editRule = function(i){
  var r = S.rules[i];
  var min = prompt("От ошибок", r.min); if (min === null) return;
  var max = prompt("До ошибок (пусто = ∞)", r.max === null ? "" : r.max); if (max === null) return;
  var pts = prompt("Баллы (от -5 до 5)", r.points); if (pts === null) return;
  var nr = { min: Number(min), max: max.trim() === "" ? null : Number(max), points: Number(pts) };
  var e = validRule(nr); if (e) return toast(e);
  S.rules[i] = nr; save(); viewSettings();
};
window.delRule = function(i){ if (!confirm("Удалить правило?")) return; S.rules.splice(i,1); save(); viewSettings(); };
window.resetRules = function(){ if (!confirm("Вернуть стандартную таблицу баллов?")) return; S.rules = DEFAULT_RULES.map(function(r){ return {min:r[0], max:r[1], points:r[2]}; }); save(); toast("Стандартная таблица восстановлена"); viewSettings(); };
window.loadBundled = function(fromLearn){
  var have = {}; S.words.forEach(function(w){ have[w.unit + "|" + w.part + "|" + w.en] = true; });
  var added = 0;
  BUNDLED.forEach(function(w){ var k = w.u + "|" + w.p + "|" + w.en; if (!have[k]){ have[k] = true; S.words.push({ id: nextId(), unit: w.u, part: w.p, en: w.en, ru: w.ru }); added++; } });
  save(); toast("Загружено новых слов: " + added);
  if (!fromLearn) go("words");
};
window.loadManual = function(){
  var lines = $("#src-text").value.split("\n").filter(function(l){ return l.trim(); });
  var added = 0, bad = 0;
  lines.forEach(function(l){
    var m = l.split(/\s+[-–—:]\s+|\s*:\s*/);
    if (m.length >= 2 && m[0].trim() && m.slice(1).join(" ").trim()){ S.words.push({ id: nextId(), unit: "Мои", part: "", en: m[0].trim(), ru: m.slice(1).join(" ").trim() }); added++; }
    else bad++;
  });
  save(); toast("Добавлено: " + added + (bad ? ", не распознано: " + bad : ""));
};

// ===== Маршрутизация =====
var ROUTES = { train: viewTrain, words: viewWords, stats: viewStats, points: viewPoints, settings: viewSettings, learn: viewLearn };
function route(){
  var name = (location.hash || "").slice(1);
  stopListen();
  if (!name) { name = (S.settings.onboarded || S.words.length) ? "train" : "learn"; }
  (ROUTES[name] || viewTrain)();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
